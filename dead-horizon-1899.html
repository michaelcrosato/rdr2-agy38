// ============================================================================
// 1. ENGINE FOUNDATION (my-3D2dge AGENT EDITION + WESTERN RIG EXTENSIONS)
// ============================================================================
/*!
my-3D2dge AGENT EDITION v0.8.1: the essential engine in one file, for AI coding agents
https://github.com/michaelcrosato/my-3d2dge (MIT License)

Retro-modern 2D games drawn entirely by code: no image or sound files, no dependencies, no network.
This is a curated subset of the full engine (dist/my-3d2dge.js). A game written against this file runs
unchanged on the full engine, which adds lighting, props, parallax backdrops, touch controls, camera
zoom and turn, dialog portraits, x-ray silhouettes and more.

AGENTS: this header is the whole manual. Build games from it; you do not need to read the code below.
Read a section only to debug: each starts with "// ---- N. NAME" (grep "// ---- 10." for the Humanoid).

## Host it
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas><script src="my-3d2dge-agent.js"><\/script><script src="game.js"><\/script></body></html>
For a single-file game, paste both scripts inline. Start every game with: const E = My3D2dge;

## Mental model
- The world is 3D: x east, y south, z up; one tile = 16 units. Game logic uses world units and dt, never pixels.
- A view projects the world to the screen. 'iso' (Diablo), 'threequarter' (Zelda), 'topdown', 'brawler' (Final
  Fight), 'side' (Mario: x right, z up, y = 0), 'overhead' (shmups, puzzles: world x/y = screen pixels once you call
  game.focus(W / 2, H / 2)). The same game runs in every view. In ground views, turn the stick or keys into a world
  direction with game.view.screenDirToGround(mx, my).
- update(dt) runs in fixed steps of about 1/120 s. Read input only there.
- draw(r) order: backgrounds first (r.sky, map.drawFloor + map.queueWalls, level.draw), then everything that can
  overlap through r.actor / r.sprite / r.queue (depth sorted), then the HUD through r.text / r.overlay (screen pixels).
- Characters are procedural rigs posed every step (E.Humanoid, E.Blob) or string sprites (E.sprite).
- Draw only with E.px, E.font, E.ui and r.*: they snap to whole pixels. ctx.arc / stroke / fillText and canvas
  gradients blur the pixel look.
- Errors show in a red box on screen and in the console; warnings start with "my-3D2dge:". Fix the first one first.

## Quick start: a complete game (title, play, win or lose)
```js quickstart
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'threequarter', views: ['threequarter', 'iso', 'topdown'] });
const map = new E.TileMap({
  rows: ['################',
         '#@.....#.......#',
         '#......#...s...#',
         '#..s.......##..#',
         '#......~~.....s#',
         '################'],
  legend: { '#': 1, '@': 'hero', s: 'slime', '~': { floor: 'water', block: true } },   // number = wall type, string = spawn tag
  types: { 1: { h: 28, top: '#7a7090', side: '#4a4560', cut: true } },   // cut: walls in front of the floor drop low
  floorTex: (x, y, tag) => tag === 'water' ? E.tex.water(x, y) : E.tex.grass(x, y)
});
const flow = new E.FlowField(map);
let hero, rig, sword, slimes, hp, msg = '';
const title = {
  update() { if (game.input.pressed('start')) game.go('play'); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    r.overlay(g => E.font.title(g, 'SLIME FIELD', r.W / 2, 70, { scale: 3, align: 'center' }));
    r.text('PRESS ENTER', r.W / 2, 150, '#ffffff', { align: 'center', shadow: '#000', outline: false });
  }
};
const play = {
  pausable: true,
  enter() {
    const s = map.find('hero');
    hero = new E.Body({ x: s.x, y: s.y, r: 5 }); hero.facing = 0; hero.hurt = 0; hp = 3;
    rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', hat: 'cap', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
    sword = new E.Attack('slash');
    slimes = map.findAll('slime').map(p => ({ body: new E.Body({ x: p.x, y: p.y, r: 6 }), rig: new E.Blob(), hp: 3, hit: 0 }));
    game.cam.bounds = v => map.bounds(v); game.follow(hero);
    game.audio.music('adventure');
  },
  update(dt) {
    const inp = game.input, m = inp.move(), d = game.view.screenDirToGround(m[0], m[1]);   // screen push -> ground direction
    hero.vx = d[0] * 85; hero.vy = d[1] * 85; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    if (inp.buffered('attack') && sword.start()) { inp.consume('attack'); game.audio.sfx('swing'); }
    sword.update(dt);
    sword.hits(slimes, s => E.inArc(hero, hero.facing, s.body, 24, 1.3), s => {
      s.hp--; s.hit = .15; E.knockback(hero, s.body, 200, 80);
      game.hitFx(s.body.x, s.body.y, 8, { damage: 1, angle: hero.facing });
    });
    flow.update(hero.x, hero.y); hero.hurt -= dt;
    for (const s of slimes) {
      const dir = flow.dir(s.body.x, s.body.y, hero.x, hero.y);
      s.body.vx = E.approach(s.body.vx, dir[0] * 30, 300 * dt); s.body.vy = E.approach(s.body.vy, dir[1] * 30, 300 * dt);
      s.body.update(dt, map); s.hit -= dt;
      s.rig.update(dt, { look: dir, squash: Math.sin(game.time * 9 + s.body.x) * .15 });
      if (E.overlap(hero, s.body) && hero.hurt <= 0) { hp--; hero.hurt = 1; E.knockback(s.body, hero, 220); game.audio.sfx('hurt'); game.shake(3); }
      if (s.hp <= 0) game.particles.explosion(s.body.x, s.body.y, 6, .7);
    }
    E.prune(slimes, s => s.hp <= 0);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing, attack: sword.state, hurt: hero.hurt > .7 });
    if (hp <= 0) game.go('end', 'GAME OVER'); else if (!slimes.length) game.go('end', 'YOU WIN');
  },
  draw(r) {
    map.drawFloor(r); map.queueWalls(r);                                   // background first, then depth-sorted things
    r.shadow(hero.x, hero.y, 6);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { alpha: hero.hurt > 0 ? .6 : 1 });
    for (const s of slimes) {
      r.shadow(s.body.x, s.body.y, 6);
      r.actor(s.body.x, s.body.y, s.body.z, (g, ox, oy) => s.rig.draw(g, ox, oy, r.view), { flash: s.hit > 0 && '#ffffff' });
    }
    r.overlay(g => E.ui.hearts(g, 6, 6, hp, 3));                        // HUD in screen pixels
  }
};
const end = {
  enter(text) { msg = text; game.audio.music(null); game.audio.sfx(text === 'YOU WIN' ? 'powerup' : 'die'); },
  update() { if (game.input.pressed('start')) game.go('title'); },
  draw(r) { r.sky(['#000000', '#301830']); r.text(msg, r.W / 2, 100, '#ffe08a', { align: 'center', scale: 2 }); }
};
game.start({ scene: 'title', scenes: { title, play, end } });
})();
```

## API
Game: new E.Game({ canvas: 'screen', res, view, views, input, bg })
  res: 'nes' 256x240 | 'snes' 256x224 | 'genesis' 320x224 | 'gb' 160x144 | 'gba' 240x160 | 'ps1' 320x240 | 'wide' 400x225 | [w, h]
  input: 'DEFAULT' | 'PLATFORMER' | 'SHMUP' | your own { action: ['KeyQ', 'Pad0', 'Mouse0'] }
  start({ update(dt), draw(r) }) or start({ scene: 'title', scenes: { title: {...}, play: {...} } })
  scene: { enter(data), exit(), update(dt), draw(r), pausable, view, views, input, res }; go(name, data, { fade: .22 })
  camera: follow(obj, { z: 16, lead }) once, or focus(x, y, z) every update; cam.bounds = v => map.bounds(v);
    cam.room = [w, h] for screen-by-screen rooms (cam.moving is true while it slides); cam.smooth = .18 (0 = locked)
  juice: hitFx(x, y, z, { power: 1, damage, angle, color, sound }), freeze(s), shake(n), flash(color, s), timeScale = .25
  timers in game time: after(s, fn), every(s, fn) -> { cancel() }, cleared on scene change
  also: setView(id), nextView() (cycles views), note(text, s), mouseGround() -> [x, y] or null
  fields: W, H, time, real, paused, input, audio, particles, view, cam, errors
Input (game.input): down(a) held, pressed(a) this step only, released(a), repeat(a, delay .3, rate .08) for menus,
  buffered(a, window .15) + consume(a) for combat, consumeAll(), anyPressed(), move() -> [x, y] on screen (length <= 1)
  every preset: up down left right (WASD, arrows, d-pad), start (Enter), pause (Esc, P), confirm (Enter, Space, J, Z),
    cancel (Esc, Backspace, X, K); the gamepad d-pad, A, B and Start work too, and its left stick moves
  DEFAULT: attack (J, X, click), dash (Space, Shift, K), skill (L, E, right click), jump (Z)
  PLATFORMER: jump (Space, Z, K), attack (X, J, click), dash (Shift, C, L), skill (E, V)
  SHMUP: fire (Space, Z, J, click), bomb (X, K, right click)
Drawing (r in draw(r); r.W, r.H = screen size in pixels)
  r.sky(['#top', '#mid', '#bottom']); r.starfield({ count: 70, speed: 30, dir: 'down' | 'up' | 'left' | 'right', height: 0..1 })
  r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { outline: true, flash: '#ffffff', flashMix: .5, alpha, bias })
  r.sprite(x, y, z, spr, { anchor: 'bottom' | 'center' | 'top', flip, flash, outline, alpha })
  r.queue(x, y, z, g => {...}, { bias }) for any depth-sorted drawing; inside it r.box(g, x0, y0, z0, x1, y1, z1, top, side)
  r.shadow(x, y, radius, alpha .5, color, surfaceZ); floor marks: r.decal(() => r.groundDisc(x, y, rad, color, alpha)),
    r.groundRing(x, y, rad, color, alpha), r.groundArc(x, y, r0, r1, a0, a1, color, alpha)
  r.text(str, x, y, color, opts); r.textAt(x, y, z, str, color); r.overlay(g => {...}); r.glowDisc(g, x, y, rad, color, 0..1)
  r.w(x, y, z) -> [px, py] where a world point lands; r.visible(x, y, z); r.view
Pixels (g is a canvas context from r.queue, r.overlay or r.actor): E.px.rect(g, x, y, w, h, c), dot(g, x, y, c),
  line(g, x0, y0, x1, y1, c, width), disc(g, x, y, r, c), ell(g, x, y, rx, ry, c), poly(g, [[x, y], ...], c),
  polyDither(g, pts, c, alpha), ddisc(g, x, y, r, c, alpha), blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...}),
  sprite(g, spr, x, y, flip). Colors are '#rrggbb' or '#rgb'.
Sprites: const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale); '.' and ' ' are clear
Text: E.font.text(g, str, x, y, color, { outline: '#0b0814' | false, shadow, gradient: [top, bottom], scale, align, wrap: px })
  -> { w, h }; E.font.title(g, str, x, y, { scale: 3, colors: [top, ..., bottom], depth, align }); E.font.width(str, opts),
  lineHeight(opts), wrap(str, px). A 5x7 font with lower case and ♥ ★ ← → ↑ ↓ • × ♪ ▸ ©
UI (draw inside r.overlay): E.ui.box(g, x, y, w, h, { bg, border, alpha }), E.ui.bar(g, x, y, w, h, 0..1, color),
  E.ui.hearts(g, x, y, hp, max) (halves allowed)
  const talk = new E.Dialog(game); talk.say(['Page one.', 'Page two.'], { name: 'ELDER', choices: ['YES', 'NO'],
    onChoice(i), onDone, place: 'top' | 'bottom', auto: 2.5, modal: false (chatter that plays on) });
    in update: if (talk.update(dt)) return;   in draw: talk.draw(r)
  const menu = new E.Menu(game, ['START', { label: 'LOAD', disabled: true }], { title, x, y, onPick(i, item), onCancel });
    menu.update(); menu.draw(r)
Sound (game.audio; it starts after the first key press): sfx(name, { vol, pitch }) with presets jump jump2 land step coin
  pickup key powerup oneup heal hit hurt stomp bump swing whoosh punch kick shoot laser charge explode boom door secret
  warp die select confirm cancel pause text blip; or sfx({ wave: 'square' | 'pulse' | 'triangle' | 'saw' | 'sine' | 'noise',
  freq: 440 | 'A4', to, dur, vol, arp: [0, 4, 7], step }); define(name, voice)
  music('title' | 'adventure' | 'dungeon' | 'boss' | 'victory') or your own { bpm: 120, steps: 4, tracks: [{ wave: 'square',
  vol: .15, notes: 'C5 - E5 . G5 . | ...' }, { wave: 'drums', notes: 'k . h . s . h .' }] } ('-' holds, '.' rests; drums
  k s h o c t); music(null) stops; mute(); setVolume(0..1)
TileMap (iso, threequarter, topdown and brawler levels):
  new E.TileMap({ rows, legend, types, floorTex }); legend: a number = wall type, a string = spawn tag,
  { tile, floor: 'water', spawn, block: true }; types[id] = { h, top, side, cut: true (drops walls in front of the
  floor), face: 'brick' | 'none', roof: 'speckle' | 'plain' }; floorTex(x, y, floorTag) -> [r, g, b]
  find(tag) / findAll(tag) -> { x, y, cx, cy }; drawFloor(r) and queueWalls(r) in draw; bounds(view);
  set(cx, cy, 0) opens a door; cell(cx, cy), walkable(cx, cy), block(cx, cy, on), toCell(x, y), center(cx, cy),
  heightAt(x, y), floorAt(x, y), los(x0, y0, x1, y1). Walls lower than a body's feet are walkable (jump onto blocks).
  floors: E.tex.grass(x, y, { base, dark, light }), dirt, water, planks, checker(x, y, { a, b, size }), plain(x, y, { base })
  new E.FlowField(map): update(tx, ty) every step, dir(x, y, tx, ty) -> [dx, dy] around walls (pathfinding)
Body (ground physics): new E.Body({ x, y, r: 5, gravity: 700, friction: 0, bounce: 0 }); set vx, vy, then
  update(dt, map); push(ix, iy, iz) knockback; jump(v); reads z, onGround, landed, hitWall, bounced
PlatformMap (side-scrollers, 2.5D in 'brawler'): new E.PlatformMap({ rows, legend, types }); types[id] = { kind:
  'solid' | 'oneway' | 'ladder' | 'slope' (dir: 1 rises right, -1 left) | 'hazard' | 'deco' | 'back', style: 'block' |
  'bonus' | 'brick' | 'ground' | 'plank' | 'spikes' | 'ladder' | 'liquid' | 'plain', side: '#hex', top: '#hex' }
  find(tag) -> { x, z } (z = feet); cell(cx, cz) and set(cx, cz, id) count rows from the BOTTOM; groundBelow(x, z) ->
  surface height, or null over a pit; touching(box, 'hazard'); solidAt(x, z); types[id]; bounds(view); draw(r) right
  after r.sky; move(box, dt, solids) moves enemy boxes { x, z, w, h, vx, vz } (sets onGround, hitWall -1 | 0 | 1,
  hitCeiling, bumped)
Platformer: new E.Platformer({ x, z, w: 8, h: 22, run: 95, jump: 285, gravity: 800, airJumps: 0, wallJump: false, dash: 0 })
  update(dt, level, game.input or { x: -1..1, jump, jumpPressed, up, down, dash }, movingPlatforms); coyote time,
  jump buffering, variable jump height, ladders, down + jump through one-ways. Reads onGround, jumped, landed, facing

## Recipes
Side-scroller (Mario, Mega Man): PlatformMap + Platformer + Humanoid, view 'side'.
```js platformer
(() => {
const E = My3D2dge;
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'side', views: ['side', 'brawler'], input: 'PLATFORMER' });
const level = new E.PlatformMap({
  rows: ['                                  ',
         '               ?                  ',
         '        ===             ==        ',
         '  @           g     ^^       g  F ',
         '#################  ###############'],
  legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', g: 'walker', F: 'flag' },
  types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }
});
const start = level.find('hero'), flag = level.find('flag');
const hero = new E.Platformer({ x: start.x, z: start.z });
const rig = new E.Humanoid({ hat: 'cap', weapon: null, colors: { cloth: '#d83a2a', pants: '#3050c0' } });
const foes = level.findAll('walker').map(p => ({ x: p.x, z: p.z, w: 12, h: 12, vx: 0, vz: 0, dir: -1, rig: new E.Blob({ feet: true, colors: { base: '#a06030', dk: '#5a3018', lt: '#d09060' } }) }));
game.cam.bounds = v => level.bounds(v);
game.particles.ground = (x, y, z) => level.groundBelow(x, z);           // sparks and debris land on platforms
game.start({
  update(dt) {
    hero.update(dt, level, game.input);
    if (hero.jumped) game.audio.sfx('jump');
    if (hero.bumped && level.types[hero.bumped.id].style === 'bonus') { level.set(hero.bumped.cx, hero.bumped.cz, 1); game.audio.sfx('coin'); game.particles.glints(hero.x, 0, hero.z + 30, 6); }
    if (level.touching(hero, 'hazard') || hero.z < -40) { Object.assign(hero, { x: start.x, z: start.z, vx: 0, vz: 0 }); game.audio.sfx('hurt'); }
    for (const f of foes) {
      f.vz -= 800 * dt; f.vx = f.dir * 25; level.move(f, dt);
      const ahead = level.groundBelow(f.x + f.dir * 8, f.z);
      if (f.hitWall || ahead === null || ahead < f.z - 4) f.dir = -f.dir;   // turn at walls and ledges
      f.rig.update(dt, { look: [f.dir, 0], walk: 1 });
      if (!f.dead && E.overlapBox(hero, f)) {
        if (hero.vz < 0 && hero.z > f.z + f.h / 2) { f.dead = true; hero.vz = 220; game.audio.sfx('stomp'); game.particles.dust(f.x, 0, f.z, 8); }
        else { hero.knock(hero.x < f.x ? -1 : 1); game.audio.sfx('hurt'); }
      }
    }
    E.prune(foes, f => f.dead);
    if (Math.abs(hero.x - flag.x) < 8) { game.audio.sfx('powerup'); Object.assign(hero, { x: start.x, z: start.z }); }
    rig.update(dt, hero.rigState());
    game.focus(hero.x, 0, hero.z + 24);                                   // side view: y = 0, z is up
  },
  draw(r) {
    r.sky(['#5c94fc', '#a8c8ff']);
    level.draw(r);
    r.queue(flag.x, 0, flag.z, g => { const [x, y] = r.w(flag.x, 0, flag.z); E.px.rect(g, x, y - 40, 2, 40, '#e8e8e8'); E.px.poly(g, [[x + 2, y - 40], [x + 14, y - 35], [x + 2, y - 30]], '#40c040'); });
    for (const f of foes) r.actor(f.x, 0, f.z, (g, ox, oy) => f.rig.draw(g, ox, oy, r.view));
    r.actor(hero.x, 0, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
  }
});
})();
```
Shoot-'em-up (1942): view 'overhead', sprites, Bullets, a starfield.
```js shmup
(() => {
const E = My3D2dge, W = 224, H = 256;
const game = new E.Game({ canvas: 'screen', res: [W, H], view: 'overhead', views: ['overhead'], input: 'SHMUP' });
const SHIP = E.sprite(['...w...', '..wbw..', '.wwbww.', 'wwrwrww', 'w..r..w'], { w: '#e8f0ff', b: '#3a7aff', r: '#ff5030' }, 2);
const FOE = E.sprite(['r.....r', '.rrrrr.', 'rryyyrr', '.r.r.r.'], { r: '#d03040', y: '#ffd040' }, 2);
const shots = new E.Bullets(game), ship = { x: W / 2, y: H - 30, r: 4 }, foes = [];
let score = 0, cool = 0, spawn = 0;
game.start({
  update(dt) {
    game.focus(W / 2, H / 2);                                            // overhead: world x/y = screen pixels
    const m = game.input.move();
    ship.x = E.clamp(ship.x + m[0] * 120 * dt, 8, W - 8); ship.y = E.clamp(ship.y + m[1] * 120 * dt, 8, H - 8);
    if ((cool -= dt) <= 0 && game.input.down('fire')) { cool = .12; shots.fire({ x: ship.x, y: ship.y - 10, vy: -300, team: 'player' }); game.audio.sfx('shoot'); }
    if ((spawn -= dt) <= 0) { spawn = .9; foes.push({ x: E.rand(20, W - 20), y: -10, r: 7, hp: 3, t: 0 }); }
    for (const f of foes) {
      f.t += dt; f.y += 40 * dt; f.x += Math.sin(f.t * 3) * 40 * dt;
      if (E.chance(dt * .6)) shots.burst({ x: f.x, y: f.y, team: 'foe', color: '#ff6080' }, [E.pattern.aim(f, ship, 90)]);
    }
    shots.update(dt);
    shots.hit(foes, (b, f) => { f.hp--; game.particles.sparks(b.x, b.y, 0, 4); }, 'player');
    for (const f of foes) if (f.hp <= 0) { score += 100; game.particles.explosion(f.x, f.y, 0, .8); }
    E.prune(foes, f => f.hp <= 0 || f.y > H + 20);
    if (shots.hit([ship], () => {}, 'foe')) { game.flash('#ff4040', .2); game.audio.sfx('hurt'); score = 0; }
  },
  draw(r) {
    r.sky(['#000010', '#101040']); r.starfield({ dir: 'down', speed: 40 });
    for (const f of foes) r.sprite(f.x, f.y, 0, FOE, { anchor: 'center' });
    r.sprite(ship.x, ship.y, 0, SHIP, { anchor: 'center' });
    shots.draw(r);
    r.text('SCORE ' + score, 4, 4, '#ffffff', { shadow: '#000', outline: false });
  }
});
})();

## Rules
1. World units and dt everywhere. Feel numbers (units per second, tile = 16): walk 70-90, run 95-140, jump 250-320
   with gravity 800, dash 200-260, player bullets 250-320, enemy bullets 70-120, enemies 25-45.
2. At 320x240, heroes are 40-60 px tall (Humanoid size 1.2-1.4), bosses size 1.8-2.4; hitboxes smaller than the art.
3. Every hit gets game.hitFx; deaths get particles.explosion; sounds on jump, hit, pickup and death; music per scene.
4. A title scene, play scenes with pausable: true, and a game-over or win path back to the title.
5. Dress every character (outfit, hat, colors) and give each its own moves; enemies wind up slower than the hero.
6. Nothing on screen? The camera looks elsewhere: game.follow(hero) or game.focus(...) every update (side: y = 0).

// ============================================================================
// 3. WESTERN GAMEPLAY SYSTEMS
// ============================================================================

// === SYSTEM: audio.js ===
/**
 * DEAD HORIZON: 1899 - Procedural Western Audio & Dynamic Soundtrack
 * Uses Web Audio API synth to generate authentic acoustic guitars, whistling,
 * harmonica, Ennio Morricone horns, galloping rhythms, gunshots, and ricochets.
 */

class WesternAudio {
  constructor(engineAudio) {
    this.ea = engineAudio;
    this.ctx = null;
    this.currentTrack = null;
    this.musicTimer = null;
    this.step = 0;
    this.muted = false;
    this.volume = 0.8;
  }

  init() {
    if (!this.ctx && typeof window !== 'undefined') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // --- SOUND EFFECTS ---
  playSfx(name, opts = {}) {
    this.init();
    if (this.muted || !this.ctx) return;

    const t = this.ctx.currentTime;
    const vol = (opts.vol || 1.0) * this.volume;

    switch (name) {
      case 'gunshot_revolver': {
        // Sharp explosion + metallic hammer snap + acoustic reverb
        this._noiseBurst(t, 0.18, vol * 0.9, 1200, 150);
        this._tone(t, 'square', 180, 40, 0.08, vol * 0.4);
        this._tone(t + 0.04, 'sine', 70, 30, 0.25, vol * 0.5);
        break;
      }
      case 'gunshot_repeater': {
        this._noiseBurst(t, 0.22, vol * 0.95, 1600, 200);
        this._tone(t, 'triangle', 220, 50, 0.12, vol * 0.5);
        break;
      }
      case 'gunshot_shotgun': {
        this._noiseBurst(t, 0.35, vol * 1.2, 800, 80);
        this._tone(t, 'sawtooth', 120, 30, 0.3, vol * 0.7);
        break;
      }
      case 'gunshot_rifle': {
        this._noiseBurst(t, 0.28, vol * 1.0, 2200, 180);
        this._tone(t, 'sine', 90, 40, 0.2, vol * 0.6);
        // distant echo
        this._noiseBurst(t + 0.12, 0.2, vol * 0.3, 1000, 200);
        break;
      }
      case 'ricochet': {
        // High rising whistle drop
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1800, t);
        o.frequency.exponentialRampToValueAtTime(3600, t + 0.06);
        o.frequency.exponentialRampToValueAtTime(400, t + 0.22);
        g.gain.setValueAtTime(vol * 0.4, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(t); o.stop(t + 0.25);
        break;
      }
      case 'hammer_cock': {
        this._noiseBurst(t, 0.03, vol * 0.3, 3000, 1800);
        this._noiseBurst(t + 0.05, 0.04, vol * 0.4, 4000, 2200);
        break;
      }
      case 'lever_action': {
        this._noiseBurst(t, 0.06, vol * 0.4, 2500, 1200);
        this._noiseBurst(t + 0.1, 0.08, vol * 0.5, 3500, 1600);
        break;
      }
      case 'deadeye_enter': {
        // Heartbeat thud + high ringing time dilation
        this._tone(t, 'sine', 60, 25, 0.4, vol * 1.0);
        this._tone(t + 0.12, 'sine', 70, 30, 0.3, vol * 0.8);
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(950, t);
        o.frequency.linearRampToValueAtTime(1200, t + 0.5);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(vol * 0.35, t + 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(t); o.stop(t + 0.6);
        break;
      }
      case 'deadeye_tag': {
        // Sharp metallic lock-on ping
        this._tone(t, 'triangle', 880, 880, 0.08, vol * 0.5);
        this._tone(t + 0.02, 'sine', 1320, 1320, 0.1, vol * 0.6);
        break;
      }
      case 'deadeye_exit': {
        this._tone(t, 'sine', 200, 50, 0.35, vol * 0.6);
        break;
      }
      case 'horse_gallop': {
        this._noiseBurst(t, 0.05, vol * 0.35, 450, 120);
        this._noiseBurst(t + 0.08, 0.04, vol * 0.25, 500, 150);
        break;
      }
      case 'horse_whinny': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(320, t);
        o.frequency.linearRampToValueAtTime(540, t + 0.15);
        o.frequency.linearRampToValueAtTime(420, t + 0.3);
        o.frequency.linearRampToValueAtTime(600, t + 0.45);
        o.frequency.linearRampToValueAtTime(250, t + 0.7);
        g.gain.setValueAtTime(vol * 0.35, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(t); o.stop(t + 0.75);
        break;
      }
      case 'whistle_call': {
        // Two-note human whistle to call horse
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1100, t);
        o.frequency.linearRampToValueAtTime(1350, t + 0.18);
        o.frequency.setValueAtTime(1350, t + 0.22);
        o.frequency.linearRampToValueAtTime(1750, t + 0.45);
        g.gain.setValueAtTime(vol * 0.4, t);
        g.gain.setValueAtTime(vol * 0.4, t + 0.42);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(t); o.stop(t + 0.55);
        break;
      }
      case 'coin':
      case 'cash_register': {
        this._tone(t, 'sine', 1400, 1400, 0.1, vol * 0.4);
        this._tone(t + 0.08, 'sine', 2100, 2100, 0.2, vol * 0.5);
        break;
      }
      case 'punch': {
        this._noiseBurst(t, 0.08, vol * 0.6, 600, 100);
        this._tone(t, 'triangle', 110, 40, 0.12, vol * 0.5);
        break;
      }
      case 'eagle_eye': {
        this._tone(t, 'sine', 550, 880, 0.4, vol * 0.3);
        break;
      }
      default:
        if (this.ea && this.ea.sfx) this.ea.sfx(name);
        break;
    }
  }

  _tone(start, type, f0, f1, dur, vol) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, start);
    o.frequency.exponentialRampToValueAtTime(Math.max(10, f1), start + dur);
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(start); o.stop(start + dur);
  }

  _noiseBurst(start, dur, vol, hi, lo) {
    if (!this.ctx) return;
    const bufferSize = Math.floor(this.ctx.sampleRate * dur);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(hi, start);
    filter.frequency.exponentialRampToValueAtTime(Math.max(20, lo), start + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    noise.connect(filter);
    filter.connect(g);
    g.connect(this.ctx.destination);
    noise.start(start);
  }

  // --- PROCEDURAL DYNAMIC WESTERN SOUNDTRACK ---
  playMusic(theme) {
    this.init();
    if (this.currentTrack === theme) return;
    this.stopMusic();
    this.currentTrack = theme;
    if (!theme || this.muted || !this.ctx) return;

    this.step = 0;
    const bpm = (theme === 'shootout' ? 132 : (theme === 'saloon' ? 120 : 88));
    const stepInterval = (60 / bpm) / 2 * 1000;

    const playStep = () => {
      if (!this.ctx || this.muted || this.currentTrack !== theme) return;
      this._renderMusicStep(theme, this.step);
      this.step++;
      this.musicTimer = setTimeout(playStep, stepInterval);
    };
    playStep();
  }

  stopMusic() {
    if (this.musicTimer) {
      clearTimeout(this.musicTimer);
      this.musicTimer = null;
    }
    this.currentTrack = null;
  }

  _renderMusicStep(theme, step) {
    const t = this.ctx.currentTime;
    const vol = this.volume * 0.4;
    const bar = Math.floor(step / 8);
    const beat = step % 8;

    if (theme === 'exploration') {
      // "Frontier Horizon" - Campfire fingerpicked acoustic guitar in D Minor / Pentatonic
      const guitarScale = [146.83, 174.61, 196.00, 220.00, 261.63, 293.66]; // D3, F3, G3, A3, C4, D4
      if (beat === 0 || beat === 4) {
        // Deep bass root
        const root = (bar % 4 === 3 ? 130.81 : (bar % 4 === 2 ? 110.00 : 146.83));
        this._tone(t, 'triangle', root, root, 0.45, vol * 0.6);
      }
      if (beat === 1 || beat === 3 || beat === 5 || beat === 7) {
        const note = guitarScale[(step * 3) % guitarScale.length];
        this._tone(t, 'sine', note, note, 0.28, vol * 0.45);
      }
      // Mournful whistle motif every 16 steps
      if (step % 16 === 0) {
        this._tone(t + 0.1, 'sine', 587.33, 587.33, 0.6, vol * 0.5); // D5
      } else if (step % 16 === 4) {
        this._tone(t + 0.1, 'sine', 659.25, 698.46, 0.5, vol * 0.5); // E5 to F5
      } else if (step % 16 === 8) {
        this._tone(t + 0.1, 'sine', 587.33, 523.25, 0.7, vol * 0.5); // D5 to C5
      }
    } else if (theme === 'shootout') {
      // "High Noon Shootout" - Galloping percussion, tense brass stabs, driving bass
      // Gallop rhythm on every 16th
      this._noiseBurst(t, 0.04, (beat % 2 === 0 ? vol * 0.5 : vol * 0.25), 300, 80);
      if (beat === 0 || beat === 4) {
        this._tone(t, 'sawtooth', 73.42, 60, 0.18, vol * 0.8); // D2 bass hit
      }
      // Tense brass stabs on beats 2 and 6
      if (beat === 2 || beat === 6) {
        this._tone(t, 'sawtooth', 293.66, 293.66, 0.12, vol * 0.45);
        this._tone(t, 'sawtooth', 440.00, 440.00, 0.12, vol * 0.4);
      }
    } else if (theme === 'redemption') {
      // "Sunset Redemption" - Warm church organ and Ennio Morricone acoustic chords
      const chords = [
        [146.83, 220.00, 293.66, 349.23], // Dm
        [174.61, 261.63, 349.23, 440.00], // F
        [130.81, 196.00, 261.63, 329.63], // C
        [146.83, 220.00, 293.66, 440.00]  // D
      ];
      const chord = chords[bar % 4];
      if (beat === 0) {
        for (const f of chord) {
          this._tone(t, 'sine', f, f, 1.2, vol * 0.35);
        }
      }
      if (beat === 4) {
        // High emotional melody tone
        const melody = [587.33, 698.46, 659.25, 880.00][bar % 4];
        this._tone(t, 'triangle', melody, melody * 0.98, 0.9, vol * 0.5);
      }
    } else if (theme === 'saloon') {
      // "Saloon Ragtime" - Upbeat syncopated honky-tonk piano
      const bass = (beat === 0 || beat === 4 ? 130.81 : 196.00);
      this._tone(t, 'square', bass, bass, 0.1, vol * 0.4);
      if (beat === 2 || beat === 6) {
        this._tone(t, 'triangle', 261.63, 261.63, 0.12, vol * 0.4);
        this._tone(t, 'triangle', 329.63, 329.63, 0.12, vol * 0.4);
      }
      if (beat === 3 || beat === 7) {
        this._tone(t, 'triangle', 392.00, 392.00, 0.08, vol * 0.35);
      }
    }
  }
}


// === SYSTEM: deadeye.js ===
/**
 * DEAD HORIZON: 1899 - Dead Eye Targeting System
 * Real-time time dilation (0.2x speed), amber chromatic filter,
 * target tagging ('X' crosshairs on fatal hitboxes), and rapid execution barrage.
 */

class DeadEyeSystem {
  constructor(audio) {
    this.audio = audio;
    this.active = false;
    this.meter = 100;       // outer ring (current energy)
    this.maxMeter = 100;
    this.core = 100;        // inner core (drain / recharge baseline)
    this.level = 3;         // Dead Eye Level 3: Manual multi-tag painting
    this.dilation = 1.0;
    this.paintedTargets = [];
    this.executing = false;
    this.execTimer = 0;
    this.execInterval = 0.09; // rapid-fire trigger fanning
    this.execIndex = 0;
    this.flash = 0;
  }

  toggle() {
    if (this.active) {
      this.deactivate(true);
    } else {
      this.activate();
    }
  }

  activate() {
    if (this.active || this.meter < 10 || this.executing) return;
    this.active = true;
    this.dilation = 0.2;
    this.paintedTargets = [];
    if (this.audio) this.audio.playSfx('deadeye_enter');
  }

  deactivate(triggerExecution = true) {
    if (!this.active) return;
    this.active = false;
    this.dilation = 1.0;
    if (this.audio) this.audio.playSfx('deadeye_exit');

    if (triggerExecution && this.paintedTargets.length > 0) {
      this.startExecution();
    } else {
      this.paintedTargets = [];
    }
  }

  addTag(target, hitPos, hitZone = 'head') {
    if (!this.active || this.executing) return false;
    if (this.paintedTargets.length >= 8) return false;

    // Check if duplicate tag on same zone
    const exists = this.paintedTargets.some(t => t.target === target && t.hitZone === hitZone);
    if (exists) return false;

    this.paintedTargets.push({
      target,
      hitZone,
      wx: hitPos[0],
      wy: hitPos[1],
      wz: hitPos[2] || 10,
      t: 0
    });

    // Small meter cost per painted target
    this.meter = Math.max(0, this.meter - 8);
    if (this.audio) this.audio.playSfx('deadeye_tag');

    if (this.meter <= 0) {
      this.deactivate(true);
    }
    return true;
  }

  startExecution() {
    this.executing = true;
    this.execIndex = 0;
    this.execTimer = 0;
  }

  update(dt, player, onShootTarget) {
    // Meter drain while active
    if (this.active) {
      const drainRate = 18; // drain over ~5.5 seconds
      this.meter -= drainRate * dt;
      if (this.meter <= 0) {
        this.meter = 0;
        this.deactivate(true);
      }
    }

    // Core passive drain & natural slow recovery
    if (!this.active && !this.executing) {
      if (this.meter < this.maxMeter) {
        const regenRate = 4 * (this.core / 100);
        this.meter = Math.min(this.maxMeter, this.meter + regenRate * dt);
      }
    }

    // Execution barrage sequence
    if (this.executing) {
      this.execTimer += dt;
      if (this.execTimer >= this.execInterval) {
        this.execTimer = 0;
        if (this.execIndex < this.paintedTargets.length) {
          const tag = this.paintedTargets[this.execIndex];
          if (onShootTarget) {
            onShootTarget(tag);
          }
          if (this.audio) {
            this.audio.playSfx('gunshot_revolver', { vol: 1.0 });
            this.audio.playSfx('ricochet', { vol: 0.6 });
          }
          this.execIndex++;
        } else {
          // Finished execution
          this.executing = false;
          this.paintedTargets = [];
        }
      }
    }
  }

  replenish(amount) {
    this.meter = Math.min(this.maxMeter, this.meter + amount);
    this.core = Math.min(100, this.core + amount * 0.5);
  }

  draw(r, pxHelper) {
    const W = r.W, H = r.H;

    // Amber vignette when Dead Eye is active
    if (this.active) {
      r.overlay(g => {
        // Red/amber gradient edge
        const grad = g.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, W * 0.75);
        grad.addColorStop(0, 'rgba(235, 175, 45, 0.08)');
        grad.addColorStop(0.65, 'rgba(195, 75, 20, 0.22)');
        grad.addColorStop(1, 'rgba(120, 15, 10, 0.65)');
        g.fillStyle = grad;
        g.fillRect(0, 0, W, H);
      });
    }

    // Draw painted target Xs
    for (let i = 0; i < this.paintedTargets.length; i++) {
      const tag = this.paintedTargets[i];
      const [sx, sy] = r.w(tag.wx, tag.wy, tag.wz);
      if (sx >= -20 && sx <= W + 20 && sy >= -20 && sy <= H + 20) {
        r.overlay(g => {
          const color = (tag.hitZone === 'head' ? '#ff2a2a' : '#ff992a');
          const sz = (tag.hitZone === 'head' ? 5 : 4);
          // Red crosshair 'X'
          pxHelper.line(g, sx - sz, sy - sz, sx + sz, sy + sz, color, 2);
          pxHelper.line(g, sx - sz, sy + sz, sx + sz, sy - sz, color, 2);
          // Target order number dot
          pxHelper.disc(g, sx, sy, 2, '#ffffff');
        });
      }
    }
  }
}


// === SYSTEM: horse.js ===
/**
 * DEAD HORIZON: 1899 - Horse Bonding & Riding System
 * Quadruped movement physics, mounting, whistling, feeding, grooming,
 * and 4 progressive bonding levels.
 */

class HorseSystem {
  constructor(engine, audio, initialBreed = 'thoroughbred') {
    this.E = engine;
    this.audio = audio;
    this.breed = initialBreed;
    this.x = 240;
    this.y = 280;
    this.z = 0;
    this.vx = 0;
    this.vy = 0;
    this.facing = 0;
    this.speed = 0;
    this.maxSpeed = 160;
    
    // Cores and meters
    this.health = 100;
    this.maxHealth = 100;
    this.healthCore = 100;
    this.stamina = 100;
    this.maxStamina = 100;
    this.staminaCore = 100;

    // Bonding: Levels 1 to 4
    this.bondingPoints = 220; // Starts at Level 2
    this.bondedLevel = 2;

    // State
    this.mounted = false;
    this.rearing = false;
    this.rearingTimer = 0;
    this.agitated = false;
    this.whistleTarget = null;
    this.saddleStow = {
      longarmPrimary: 'carbine_repeater',
      longarmSecondary: 'hunting_bow',
      pelt: 'Pristine Whitetail Buck Pelt',
      carcass: null
    };

    // Instantiate procedural 3D rig from engine
    this.rig = new this.E.WesternHorse({ breed: this.breed });
  }

  getBondingLevel() {
    if (this.bondingPoints >= 800) return 4;
    if (this.bondingPoints >= 450) return 3;
    if (this.bondingPoints >= 150) return 2;
    return 1;
  }

  addBonding(points) {
    this.bondingPoints = Math.min(1000, this.bondingPoints + points);
    const newLvl = this.getBondingLevel();
    if (newLvl > this.bondedLevel) {
      this.bondedLevel = newLvl;
      if (this.audio) this.audio.playSfx('cash_register', { vol: 0.8 });
      return true; // Leveled up
    }
    return false;
  }

  whistle(playerPos) {
    if (this.mounted) return;
    if (this.audio) {
      this.audio.playSfx('whistle_call');
      setTimeout(() => this.audio.playSfx('horse_whinny', { vol: 0.5 }), 300);
    }
    this.whistleTarget = [playerPos[0] + 15, playerPos[1] + 10];
  }

  feed(item = 'apple') {
    this.stamina = Math.min(this.maxStamina, this.stamina + 40);
    this.staminaCore = Math.min(100, this.staminaCore + 30);
    this.healthCore = Math.min(100, this.healthCore + 25);
    this.agitated = false;
    this.addBonding(25);
    if (this.audio) this.audio.playSfx('coin');
  }

  brush() {
    this.staminaCore = Math.min(100, this.staminaCore + 15);
    this.agitated = false;
    this.addBonding(15);
    if (this.audio) this.audio.playSfx('punch', { vol: 0.2 });
  }

  calm() {
    this.agitated = false;
    this.stamina = Math.min(this.maxStamina, this.stamina + 20);
    this.addBonding(10);
    if (this.audio) this.audio.playSfx('horse_whinny', { vol: 0.3 });
  }

  rear() {
    if (this.rearing || this.bondedLevel < 2) return;
    this.rearing = true;
    this.rearingTimer = 1.0;
    if (this.audio) this.audio.playSfx('horse_whinny', { vol: 0.8 });
  }

  mount(player) {
    this.mounted = true;
    this.whistleTarget = null;
    player.mounted = true;
    this.x = player.x;
    this.y = player.y;
    if (this.audio) this.audio.playSfx('punch', { vol: 0.3 });
  }

  dismount(player) {
    this.mounted = false;
    player.mounted = false;
    // place player slightly beside horse
    player.x = this.x + Math.sin(this.facing) * 12;
    player.y = this.y - Math.cos(this.facing) * 12;
    player.z = 0;
    this.vx = 0;
    this.vy = 0;
    if (this.audio) this.audio.playSfx('punch', { vol: 0.2 });
  }

  update(dt, input, player, map) {
    // Rearing animation countdown
    if (this.rearing) {
      this.rearingTimer -= dt;
      if (this.rearingTimer <= 0) {
        this.rearing = false;
      }
    }

    if (this.mounted) {
      // Player controls the horse
      const move = input.move(); // [dx, dy] on screen
      const mx = move[0], my = move[1];
      const isSprinting = input.down('dash');
      
      let targetSpeed = 0;
      if (Math.hypot(mx, my) > 0.1) {
        // Turn facing toward move direction
        const ang = Math.atan2(my, mx);
        this.facing = this.E.approachAng(this.facing, ang, dt * 6);

        if (isSprinting && this.stamina > 5) {
          targetSpeed = this.maxSpeed * (1 + (this.bondedLevel - 1) * 0.1);
          this.stamina -= (this.bondedLevel === 4 ? 6 : 12) * dt;
        } else {
          targetSpeed = 75; // Trot
          this.stamina = Math.min(this.maxStamina, this.stamina + 6 * dt);
        }

        // Gallop audio rhythm
        if (Math.random() < dt * (isSprinting ? 4.5 : 2.5)) {
          if (this.audio) this.audio.playSfx('horse_gallop', { vol: 0.4 });
        }
      } else {
        // Natural resting recovery
        this.stamina = Math.min(this.maxStamina, this.stamina + 14 * dt);
        if (input.pressed('jump')) {
          this.rear();
        }
      }

      this.speed = this.E.lerp(this.speed, targetSpeed, Math.min(1, dt * 7));
      this.vx = Math.cos(this.facing) * this.speed;
      this.vy = Math.sin(this.facing) * this.speed;

      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // Keep player locked onto horse rider point
      const offset = this.rig.riderOffset();
      player.x = this.x + offset[0];
      player.y = this.y + offset[1];
      player.z = offset[2];
      player.facing = this.facing;

    } else if (this.whistleTarget) {
      // Auto-gallop toward whistle caller
      const dx = this.whistleTarget[0] - this.x;
      const dy = this.whistleTarget[1] - this.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 18) {
        this.facing = Math.atan2(dy, dx);
        this.speed = this.E.lerp(this.speed, 95, Math.min(1, dt * 8));
        this.vx = Math.cos(this.facing) * this.speed;
        this.vy = Math.sin(this.facing) * this.speed;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
      } else {
        this.speed = this.E.lerp(this.speed, 0, Math.min(1, dt * 10));
        this.whistleTarget = null;
      }
    } else {
      // Idle grazing or standing
      this.speed = this.E.lerp(this.speed, 0, Math.min(1, dt * 8));
      this.vx = 0;
      this.vy = 0;
    }

    // Update 3D procedural rig
    this.rig.update(dt, {
      vx: this.vx,
      vy: this.vy,
      facing: this.facing,
      rearing: this.rearing
    });
  }

  draw(r) {
    r.actor(this.x, this.y, this.z, (g, ox, oy) => {
      this.rig.draw(g, ox, oy, r.view);
    });
  }
}

/**
 * DEAD HORIZON: 1899 - Combat System
 * Weapon arsenal, ballistics bullets, condition cleaning, cover mechanics,
 * saloon brawling combos, and intelligent enemy outlaw AI.
 */


class CombatSystem {
  constructor(engine, game, audio, particles) {
    this.E = engine;
    this.game = game;
    this.audio = audio;
    this.particles = particles;

    // Bullet simulator on ground plane
    this.bullets = new this.E.Bullets(game, { plane: 'ground' });

    // Active weapon wheel / inventory
    this.weapons = JSON.parse(JSON.stringify(WEAPONS));
    this.equippedId = 'cattleman';
    this.ammoInMag = {
      cattleman: 6,
      schofield: 6,
      double_action: 6,
      volcanic: 8,
      mauser: 10,
      carbine_repeater: 7,
      lancaster_repeater: 14,
      springfield_rifle: 1,
      bolt_action_rifle: 5,
      varmint_rifle: 14,
      rolling_block: 1,
      double_barrel_shotgun: 2,
      pump_action_shotgun: 5,
      hunting_bow: 1,
      dynamite: 8,
      fire_bottle: 8,
      hunting_knife: 99,
      lasso: 99
    };
    this.ammoPouch = {
      revolver: 120,
      pistol: 100,
      repeater: 140,
      rifle: 60,
      shotgun: 48,
      varmint: 80,
      arrow: 40,
      explosive: 8,
      incendiary: 8
    };

    this.reloading = false;
    this.reloadTimer = 0;
    this.fireCooldown = 0;
    this.inCover = false;
    this.coverPoint = null;

    // Brawling state
    this.brawlCombo = new this.E.Combo(['jab', 'cross', 'uppercut'], { window: 0.35 });
    this.blocking = false;

    // Active enemies in the world
    this.enemies = [];
  }

  get equipped() {
    return this.weapons[this.equippedId] || this.weapons.cattleman;
  }

  equip(weaponId) {
    if (this.weapons[weaponId]) {
      this.equippedId = weaponId;
      this.reloading = false;
      if (this.audio) this.audio.playSfx('hammer_cock');
    }
  }

  cleanWeapon() {
    const w = this.equipped;
    if (w) {
      w.condition = 100;
      if (this.audio) this.audio.playSfx('lever_action');
    }
  }

  reload() {
    const w = this.equipped;
    if (!w || !w.ammoType || this.reloading) return;
    const current = this.ammoInMag[this.equippedId] || 0;
    const max = w.ammoMax || 6;
    if (current >= max) return;
    const pool = this.ammoPouch[w.ammoType] || 0;
    if (pool <= 0) return;

    this.reloading = true;
    this.reloadTimer = (w.reload ? (100 - w.reload) * 0.02 + 0.6 : 1.2);
    if (this.audio) this.audio.playSfx('lever_action');
  }

  fire(origin, targetPos, team = 'player', options = {}) {
    const w = this.equipped;
    if (!w || this.fireCooldown > 0 || this.reloading) return false;

    // Check ammo
    if (w.ammoType) {
      const mag = this.ammoInMag[this.equippedId] || 0;
      if (mag <= 0) {
        if (this.audio) this.audio.playSfx('hammer_cock', { vol: 0.4 });
        this.reload();
        return false;
      }
      this.ammoInMag[this.equippedId]--;
    }

    // Weapon condition degradation
    w.condition = Math.max(10, w.condition - 0.25);
    const condMult = w.condition / 100;

    // Aim direction with accuracy spread
    const dx = targetPos[0] - origin[0];
    const dy = targetPos[1] - origin[1];
    let angle = Math.atan2(dy, dx);
    const spread = (options.deadEye ? 0 : (100 - w.accuracy) * 0.002);
    angle += (Math.random() - 0.5) * spread;

    const speed = (w.category === 'Bow' ? 180 : (w.category === 'Shotgun' ? 240 : 320));
    const damage = Math.round(w.damage * (0.7 + 0.3 * condMult));

    if (w.category === 'Shotgun') {
      // 5-pellet buckshot spread
      for (let p = -2; p <= 2; p++) {
        const spreadAngle = angle + p * 0.08;
        this.bullets.fire({
          x: origin[0], y: origin[1], z: origin[2] || 10,
          vx: Math.cos(spreadAngle) * speed,
          vy: Math.sin(spreadAngle) * speed,
          vz: 0,
          r: 2,
          team,
          dmg: Math.round(damage / 3),
          color: '#ffd080',
          life: 0.6
        });
      }
    } else if (w.category === 'Thrown') {
      // Arc throw
      this.bullets.fire({
        x: origin[0], y: origin[1], z: origin[2] || 10,
        vx: Math.cos(angle) * 140,
        vy: Math.sin(angle) * 140,
        vz: 60,
        r: 3,
        team,
        dmg: damage,
        color: '#ff4020',
        life: 1.5,
        isExplosive: true
      });
    } else {
      // Single precision rifle / revolver bullet
      this.bullets.fire({
        x: origin[0], y: origin[1], z: origin[2] || 10,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        vz: 0,
        r: 2,
        team,
        dmg: damage,
        color: (options.deadEye ? '#ff2020' : '#ffe090'),
        life: 1.5
      });
    }

    // Muzzle flash & smoke particles
    if (this.particles) {
      this.particles.sparks(origin[0] + Math.cos(angle) * 8, origin[1] + Math.sin(angle) * 8, origin[2] || 10, 6, angle);
      this.particles.smoke(origin[0] + Math.cos(angle) * 6, origin[1] + Math.sin(angle) * 6, origin[2] || 10, 3);
    }

    // Audio cue based on category
    if (this.audio) {
      if (w.category === 'Shotgun') this.audio.playSfx('gunshot_shotgun');
      else if (w.category === 'Rifle' || w.category === 'Sniper Rifle') this.audio.playSfx('gunshot_rifle');
      else if (w.category === 'Repeater') this.audio.playSfx('gunshot_repeater');
      else if (w.category === 'Bow') this.audio.playSfx('whoosh');
      else this.audio.playSfx('gunshot_revolver');
    }

    this.fireCooldown = (100 - w.fireRate) * 0.008 + 0.12;
    return true;
  }

  spawnEnemy(o = {}) {
    const enemy = {
      id: 'foe_' + Math.random().toString(36).substr(2, 9),
      name: o.name || 'Colter Outlaw',
      faction: o.faction || 'colter',
      x: o.x || 300,
      y: o.y || 300,
      z: 0,
      hp: o.hp || 70,
      maxHp: o.hp || 70,
      speed: 45,
      facing: 0,
      alert: false,
      dead: false,
      state: 'combat', // 'idle', 'patrol', 'cover', 'combat', 'charge'
      stateTimer: 0,
      fireTimer: Math.random() * 2 + 1,
      rig: new this.E.Humanoid({
        build: 'heroic',
        outfit: 'coat',
        hat: { style: 'cowboy', color: (o.faction === 'law' ? '#222d3b' : '#3d2516') },
        colors: {
          cloth: (o.faction === 'law' ? '#293e56' : '#593220'),
          coat: (o.faction === 'law' ? '#1b2838' : '#382218'),
          pants: '#2d251d'
        }
      })
    };
    this.enemies.push(enemy);
    return enemy;
  }

  update(dt, player, map) {
    if (this.fireCooldown > 0) this.fireCooldown -= dt;

    // Reloading cycle
    if (this.reloading) {
      this.reloadTimer -= dt;
      if (this.reloadTimer <= 0) {
        this.reloading = false;
        const w = this.equipped;
        if (w && w.ammoType) {
          const needed = (w.ammoMax || 6) - (this.ammoInMag[this.equippedId] || 0);
          const avail = Math.min(needed, this.ammoPouch[w.ammoType] || 0);
          this.ammoInMag[this.equippedId] += avail;
          this.ammoPouch[w.ammoType] -= avail;
        }
      }
    }

    // Update bullets
    this.bullets.update(dt, map);

    // Player bullets hitting enemies
    this.bullets.hit(this.enemies, (b, foe) => {
      if (foe.dead) return;
      foe.hp -= b.dmg;
      if (this.particles) {
        this.particles.sparks(b.x, b.y, b.z || 8, 4);
      }
      if (foe.hp <= 0) {
        foe.dead = true;
        foe.hp = 0;
        if (this.particles) {
          this.particles.dust(foe.x, foe.y, 0, 8);
        }
      }
    }, 'player');

    // Enemy AI update
    for (const foe of this.enemies) {
      if (foe.dead) continue;
      const dx = player.x - foe.x;
      const dy = player.y - foe.y;
      const dist = Math.hypot(dx, dy);

      foe.facing = Math.atan2(dy, dx);
      foe.fireTimer -= dt;

      if (dist > 35) {
        // Move closer
        foe.x += Math.cos(foe.facing) * foe.speed * dt;
        foe.y += Math.sin(foe.facing) * foe.speed * dt;
      }

      // Enemy firing at player
      if (foe.fireTimer <= 0 && dist < 250) {
        foe.fireTimer = Math.random() * 2.2 + 1.2;
        this.bullets.fire({
          x: foe.x, y: foe.y, z: 10,
          vx: Math.cos(foe.facing) * 220,
          vy: Math.sin(foe.facing) * 220,
          vz: 0,
          r: 2,
          team: 'foe',
          dmg: 15,
          color: '#ff8040',
          life: 1.5
        });
        if (this.audio) this.audio.playSfx('gunshot_revolver', { vol: 0.6 });
      }

      // Update enemy 3D humanoid rig
      foe.rig.update(dt, {
        x: foe.x, y: foe.y, z: foe.z,
        vx: Math.cos(foe.facing) * (dist > 35 ? foe.speed : 0),
        vy: Math.sin(foe.facing) * (dist > 35 ? foe.speed : 0),
        facing: foe.facing,
        point: true
      });
    }

    // Enemy bullets hitting player
    this.bullets.hit([player], (b, p) => {
      p.health -= b.dmg;
      if (this.audio) this.audio.playSfx('hurt');
      if (this.particles) this.particles.sparks(p.x, p.y, p.z || 10, 5);
      if (p.health <= 0) p.health = 0;
    }, 'foe');

    // Remove dead enemies that faded
    this.E.prune(this.enemies, f => f.dead && f.fadeTimer && f.fadeTimer <= 0);
  }

  draw(r) {
    // Draw active bullets
    this.bullets.draw(r);

    // Draw enemies
    for (const foe of this.enemies) {
      if (foe.dead) {
        // Fallen on ground
        r.actor(foe.x, foe.y, foe.z, (g, ox, oy) => {
          foe.rig.draw(g, ox, oy, r.view);
        });
      } else {
        r.actor(foe.x, foe.y, foe.z, (g, ox, oy) => {
          foe.rig.draw(g, ox, oy, r.view);
        });
        // Health bar above active enemy
        const [sx, sy] = r.w(foe.x, foe.y, foe.z + 24);
        if (r.visible(foe.x, foe.y, foe.z)) {
          r.overlay(g => {
            const pct = Math.max(0, foe.hp / foe.maxHp);
            this.E.px.rect(g, sx - 12, sy - 4, 24, 3, '#100a08');
            this.E.px.rect(g, sx - 11, sy - 3, Math.round(22 * pct), 1, '#d93829');
          });
        }
      }
    }
  }
}
